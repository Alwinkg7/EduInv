{% extends 'AdminPanel.html' %}
{% block content %}
<section id="tmpl-structure">
    <h2 class="title">Investors Signed Up</h2>
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive pt-3">
                    <table class="table table-dark">
                        <thead>
                            <tr>
                                <th>Investor Name</th>
                                <th></th>
                                <th></th>
                                <th>Investor Email</th>
                                <th></th>
                                <th></th>
                                <th>Investor Password</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for investor in investorsdata %}
                            <tr>
                                <td>{{ investor.investorname }}</td>
                                <td></td>
                                <td></td>
                                <td>{{ investor.investoremail }}</td>
                                <td></td>
                                <td></td>
                                <td>{{ investor.investorpassword }}</td>
                                <td>
                                    <a href="{% url 'deleteinvestordata' dataid=investor.id %}"><button type="submit">Delete</button></a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
