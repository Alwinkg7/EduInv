{% extends 'AdminPanel.html' %}
{% block content %}
<section id="tmpl-structure">
    <h2 class="title">Clients Signed Up</h2>
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive pt-3">
                    <table class="table table-dark">
                        <thead>
                            <tr>
                                <th>Client Name</th>
                                <th></th>
                                <th></th>
                                <th>Client Email</th>
                                <th></th>
                                <th></th>
                                <th>Client Password</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for i in clientsdata %}
                            <tr>
                                <td>{{ i.clientname }}</td>
                                <td></td>
                                <td></td>
                                <td>{{ i.clientemail }}</td>
                                <td></td>
                                <td></td>
                                <td>{{ i.clientpassword }}</td>
                                <td>
                                    <a href="{% url 'deleteclientdata' dataid=i.id %}"><button type="submit">Delete</button></a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
